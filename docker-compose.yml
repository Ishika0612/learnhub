services:
  postgres:
    image: postgres:16
    container_name: learnhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnhub
      POSTGRES_PASSWORD: learnhub_dev_password
      POSTGRES_DB: learnhub
    ports:
      - "5433:5432"
    volumes:
      - learnhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhub -d learnhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  learnhub_postgres_data:
